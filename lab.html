<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lab | Üçler Gönültaş</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        .lab-hero {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .lab-title {
            font-size: clamp(3rem, 10vw, 8rem);
            font-family: var(--font-heading);
            color: transparent;
            -webkit-text-stroke: 1px var(--text-primary);
            opacity: 0.8;
            letter-spacing: -2px;
        }

        .lab-subtitle {
            font-size: 1.2rem;
            color: var(--accent-lime);
            margin-top: 1rem;
            font-family: var(--font-heading);
        }

        .experiments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding-bottom: 8rem;
        }

        .experiment-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .experiment-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-lime);
        }

        .exp-preview {
            height: 200px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            color: #333;
            font-size: 0.8rem;
        }

        .exp-info {
            padding: 1.5rem;
        }

        .exp-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .exp-date {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">UCLER<span class="accent-dot">.</span></a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link active" style="color:var(--accent-lime)">The Lab</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="lab-hero">
            <div>
                <h1 class="lab-title">THE LAB</h1>
                <p class="lab-subtitle">Experiments, Failures, and serendipity.</p>
            </div>
        </section>

        <section class="experiments-grid">
            <div class="experiment-card">
                <div class="exp-preview"
                    style="background: radial-gradient(circle, #D9FF00 0%, transparent 70%); opacity:0.2;">
                    WebGL Visualizer
                </div>
                <div class="exp-info">
                    <h3 class="exp-title">Audio Reactive</h3>
                    <p class="exp-date">Experiment 01</p>
                </div>
            </div>
            <div class="experiment-card">
                <div class="exp-preview" style="background: linear-gradient(45deg, #7c3aed, #2dd4bf); opacity:0.2;">
                    Fluid Sim
                </div>
                <div class="exp-info">
                    <h3 class="exp-title">Neon Fluid</h3>
                    <p class="exp-date">Experiment 02</p>
                </div>
            </div>
            <div class="experiment-card">
                <div class="exp-preview" style="border: 1px dashed #333;">
                    Typography Distortion
                </div>
                <div class="exp-info">
                    <h3 class="exp-title">Kinetic Type</h3>
                    <p class="exp-date">Experiment 03</p>
                </div>
            </div>
        </section>
    </main>

    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>
    <script type="module" src="/main.ts"></script>
</body>

</html>
