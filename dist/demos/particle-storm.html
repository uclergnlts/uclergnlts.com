<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Storm | The Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #050505;
            color: #fff;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .header {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .info-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            max-width: 350px;
        }

        .info-panel h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-panel p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
        }

        .control-hint span {
            color: #D9FF00;
        }

        /* Gradient overlay for depth */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(5, 5, 5, 0.5) 100%);
            pointer-events: none;
            z-index: 5;
        }
    </style>
  <script type="module" crossorigin src="/assets/particleStorm-BeHp_qDr.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/three.module-BvLKSbK-.js">
</head>

<body>
    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <div class="header">
        <a href="lab.html" class="back-btn">← Back to Lab</a>
    </div>

    <div class="info-panel">
        <h1>Particle Storm</h1>
        <p>10,000 particles dancing in 3D space. Move your mouse to interact with the particle field. The particles
            react to your cursor position.</p>
    </div>

    <div class="controls">
        <div class="control-hint"><span>Mouse</span> — Interact</div>
        <div class="control-hint"><span>Scroll</span> — Zoom</div>
    </div>

</body>

</html>
