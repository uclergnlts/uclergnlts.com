<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Tunnel | The Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .header {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .info-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            max-width: 350px;
        }

        .info-panel h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-panel p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }

        .controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
        }

        .control-hint {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: right;
            margin-bottom: 0.3rem;
        }

        .control-hint span {
            color: #4ecdc4;
        }

        .speed-indicator {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .speed-indicator span {
            color: #4ecdc4;
            font-size: 1.2rem;
        }
    </style>
  <script type="module" crossorigin src="/assets/infiniteTunnel-BjxpGuRO.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/three.module-BvLKSbK-.js">
</head>

<body>
    <div id="canvas-container"></div>

    <div class="header">
        <a href="lab.html" class="back-btn">← Back to Lab</a>
    </div>

    <div class="speed-indicator">
        Speed: <span id="speed-value">1.0x</span>
    </div>

    <div class="info-panel">
        <h1>Infinite Tunnel</h1>
        <p>Fly through an endless procedural tunnel. The geometry regenerates infinitely as you travel forward through
            cyberspace.</p>
    </div>

    <div class="controls">
        <div class="control-hint"><span>Mouse</span> — Look around</div>
        <div class="control-hint"><span>Scroll</span> — Speed</div>
    </div>

</body>

</html>
