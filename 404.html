<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Üçler Gönültaş</title>
    <meta name="description" content="The requested page could not be found on Üçler Gönültaş's portfolio.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://uclergnlts.com/404.html">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 2rem;
        }

        .not-found {
            max-width: 680px;
        }

        .not-found h1 {
            font-family: var(--font-heading);
            font-size: clamp(4rem, 18vw, 12rem);
            line-height: 0.85;
            color: transparent;
            -webkit-text-stroke: 1px var(--text-primary);
            margin-bottom: 1.5rem;
        }

        .not-found p {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .not-found a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 1.4rem;
            border: 1px solid var(--accent-lime);
            color: var(--accent-lime);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <main class="not-found">
        <h1>404</h1>
        <p>This page slipped out of the build. Head back to the portfolio, selected work and lab experiments.</p>
        <a href="/">Back Home</a>
    </main>
</body>

</html>
